services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        environment:
            APP_ENV: prod
            APP_DEBUG: 0
        volumes:
            - ./:/var/www/html:cached
            - symfony_var:/var/www/html/var
            - symfony_vendor:/var/www/html/vendor
        ports:
            - "8090:80"
        depends_on:
            - mysql

    mysql:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: symfony
            MYSQL_USER: symfony
            MYSQL_PASSWORD: symfony
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        environment:
            PMA_HOST: mysql
            PMA_USER: symfony
            PMA_PASSWORD: symfony
        ports:
            - "8091:80"
        depends_on:
            - mysql

volumes:
    mysql_data:
    symfony_var:
    symfony_vendor:

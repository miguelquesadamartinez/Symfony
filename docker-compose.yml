services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        environment:
            APP_ENV: dev
            APP_DEBUG: 1
        volumes:
            - ./:/var/www/html
            #- symfony_var:/var/www/html/var
            - symfony_vendor:/var/www/html/vendor
        ports:
            - "8090:80"
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: symfony
            MYSQL_USER: symfony
            MYSQL_PASSWORD: symfony
            MYSQL_ROOT_PASSWORD: root
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 10s
        ports:
            - "3308:3306"
        volumes:
            - ./mysql_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        environment:
            PMA_HOST: mysql
            PMA_USER: symfony
            PMA_PASSWORD: symfony
        ports:
            - "8091:80"
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    #mysql_data:
    symfony_var:
    symfony_vendor:
